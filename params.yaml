
data:
  train_path: data/raw/train.csv
  later_path: data/raw/later.csv
  holdout_path: data/raw/holdout_features.csv

cleaning:
  target_outlier_threshold: 1000
  target_scale_divisor: 10
  target_register_tolerance: 20
  shelf_hours_threshold: 24
  shelf_hours_conversion_divisor: 60
  day_type_mapping:
    wee.: weekend
    fes.: festival

model:
  name: RandomForestRegressor
  random_state: 42
  n_jobs: -1
  candidates:
    - n_estimators: 200
      min_samples_leaf: 1
      max_features: 1.0
    - n_estimators: 300
      min_samples_leaf: 1
      max_features: 1.0
    - n_estimators: 400
      min_samples_leaf: 2
      max_features: 0.8

validation:
  test_size: 0.2
  random_state: 42

preprocessing:
  numeric_imputation: median
  categorical_imputation: most_frequent
  scaling: StandardScaler
  encoding: OneHotEncoder
  handle_unknown: ignore
